name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: "Appointment system/pnpm-lock.yaml"
      - name: Install
        run: pnpm --dir "Appointment system" install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir "Appointment system" typecheck
      - name: Test
        run: pnpm --dir "Appointment system" test
      - name: Build
        run: pnpm --dir "Appointment system" build
